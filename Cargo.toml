[package]
name = "charon-audio"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
authors = ["Valkyra Labs"]
license = "MIT OR Apache-2.0"
description = "Rust music source separation pipeline for ONNX models"
keywords = ["audio", "music", "separation", "ml", "demucs"]
categories = ["multimedia::audio", "science"]
readme = "README.md"
repository = "https://github.com/Valkyra-Labs/charon-audio"
homepage = "https://github.com/Valkyra-Labs/charon-audio"
documentation = "https://docs.rs/charon-audio"
exclude = [".github/", "tools/", "docs/audit/", "docs/parity/", "models/*.onnx"]

[dependencies]
# ML inference. ONNX Runtime release candidates break API between RCs, so the
# version is pinned exactly; bump deliberately.
# Default features minus `ndarray` (tensors are passed as flat buffers, which
# avoids compiling a second ndarray version) and `tracing`.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-27",
] }

# Audio I/O and processing
# Codecs and containers are listed explicitly; "all" would also pull in
# video/subtitle experiments and every metadata reader.
# Optional (feature `decode`); its AAC decoder is a separate feature
# (`aac`) because shipping an AAC decoder falls under the AAC patent pool,
# so an application can decode AAC through the operating system instead.
symphonia = { version = "0.6", optional = true, default-features = false, features = [
    "opt-simd", "all-meta",
    "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis",
    "aiff", "caf", "isomp4", "mkv", "ogg", "wav",
] }
rubato = "0.15"
hound = "3.5"
flacenc = { version = "0.5", default-features = false, features = ["par"] }
cpal = { version = "0.15", optional = true }

# Numerical computing
ndarray = { version = "0.15", features = ["rayon"] }
realfft = "3.5"
sha2 = { version = "0.10", optional = true }

# Parallel processing
rayon = "1.10"

# Error handling
thiserror = "1.0"

# Utilities
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
walkdir = "2.5"

[dev-dependencies]
anyhow = "1.0"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
env_logger = "0.11"
libc = "0.2"

[features]
default = ["ort-backend", "decode", "aac"]
ort-backend = ["dep:ort"]
# Read audio files (Symphonia): WAV, FLAC, MP3, OGG/Vorbis, ALAC, AIFF,
# CAF, MP4 and MKV containers. Without it the library works on PCM
# buffers only.
decode = ["dep:symphonia"]
# Symphonia's AAC-LC decoder.
aac = ["decode", "symphonia/aac"]
realtime = ["dep:cpal"]
# Apple CoreML execution provider (macOS). Used by the split-transform
# HTDemucs export; measured in docs/parity/2026-09-25-gpu-and-speed.md.
coreml = ["ort-backend", "ort/coreml", "dep:sha2"]
# GPU execution providers for measurement only (examples/ep_probe). Not a
# supported path: see docs/parity for what was measured.
ep-experimental = ["coreml", "ort/webgpu"]

[package.metadata.docs.rs]
features = ["ort-backend", "decode", "aac"]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "audio_bench"
harness = false

[[bin]]
name = "charon"
path = "src/bin/charon.rs"
required-features = ["ort-backend", "decode"]

[lib]
name = "charon_audio"
path = "src/lib.rs"

[[example]]
name = "separate"
path = "examples/separate.rs"
required-features = ["ort-backend", "decode"]

[[example]]
name = "batch"
path = "examples/batch.rs"
required-features = ["ort-backend", "decode"]

[[example]]
name = "realtime"
path = "examples/realtime.rs"
required-features = ["ort-backend"]

[[example]]
name = "profile"
path = "examples/profile.rs"
required-features = ["ort-backend", "decode"]

[[example]]
name = "ep_probe"
path = "examples/ep_probe.rs"
required-features = ["ort-backend"]

[[example]]
name = "advanced"
path = "examples/advanced.rs"
required-features = ["ort-backend", "decode"]
