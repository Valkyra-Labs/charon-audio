[package]
name = "charon-audio"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
authors = ["Valkyra Labs"]
license = "MIT"
description = "Rust music source separation pipeline for ONNX models"
keywords = ["audio", "music", "separation", "ml", "demucs"]
categories = ["multimedia::audio", "science"]
readme = "README.md"
repository = "https://github.com/Valkyra-Labs/charon-audio"
homepage = "https://github.com/Valkyra-Labs/charon-audio"
documentation = "https://docs.rs/charon-audio"

[dependencies]
# ML inference. ONNX Runtime release candidates break API between RCs, so the
# version is pinned exactly; bump deliberately.
# Default features minus `ndarray` (tensors are passed as flat buffers, which
# avoids compiling a second ndarray version) and `tracing`.
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "download-binaries",
    "tls-native",
    "copy-dylibs",
    "api-27",
] }

# Audio I/O and processing
# Codecs and containers are listed explicitly; "all" would also pull in
# video/subtitle experiments and every metadata reader.
symphonia = { version = "0.6", default-features = false, features = [
    "opt-simd", "all-meta",
    "aac", "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis",
    "aiff", "caf", "isomp4", "mkv", "ogg", "wav",
] }
rubato = "0.15"
hound = "3.5"
flacenc = { version = "0.5", default-features = false, features = ["par"] }
cpal = { version = "0.15", optional = true }

# Numerical computing
ndarray = { version = "0.15", features = ["rayon"] }

# Parallel processing
rayon = "1.10"

# Error handling
thiserror = "1.0"

# Utilities
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
indicatif = "0.17"
walkdir = "2.5"

[dev-dependencies]
anyhow = "1.0"
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
env_logger = "0.11"
libc = "0.2"
serde_json = "1.0"

[features]
default = ["ort-backend"]
ort-backend = ["dep:ort"]
realtime = ["dep:cpal"]

[package.metadata.docs.rs]
features = ["ort-backend"]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "audio_bench"
harness = false

[lib]
name = "charon_audio"
path = "src/lib.rs"

[[example]]
name = "separate"
path = "examples/separate.rs"
required-features = ["ort-backend"]

[[example]]
name = "batch"
path = "examples/batch.rs"
required-features = ["ort-backend"]

[[example]]
name = "realtime"
path = "examples/realtime.rs"
required-features = ["ort-backend"]

[[example]]
name = "profile"
path = "examples/profile.rs"
required-features = ["ort-backend"]

[[example]]
name = "advanced"
path = "examples/advanced.rs"
